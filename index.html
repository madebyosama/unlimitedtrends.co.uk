<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unlimited Trends | Coming Soon</title>
    <meta name="description" content="Unlimited Trends is coming soon." />
    <style>
      :root {
        --bg: #0b0b0b;
        --panel: #111111;
        --text: #f5f5f5;
        --muted: #b3b3b3;
        --line: rgba(255, 255, 255, 0.12);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .wrap {
        width: min(720px, 100%);
        border: 1px solid var(--line);
        background: rgba(17, 17, 17, 0.9);
        padding: clamp(28px, 5vw, 64px);
      }

      .brand {
        margin-bottom: 28px;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 10vw, 7rem);
        line-height: 0.9;
        letter-spacing: -0.08em;
        font-weight: 700;
      }

      .sub {
        margin-top: 20px;
        max-width: 32rem;
        color: var(--muted);
        font-size: 1.02rem;
        line-height: 1.7;
      }

      .contact {
        margin-top: 28px;
      }

      .contact a {
        color: var(--text);
        text-decoration: none;
        border-bottom: 1px solid var(--line);
        padding-bottom: 2px;
      }

      .contact a:hover {
        opacity: 0.8;
      }

      @media (max-width: 520px) {
        .wrap {
          padding: 24px 20px;
        }

        .brand {
          letter-spacing: 0.12em;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="brand">Unlimited Trends</div>
      <h1>Coming<br />Soon.</h1>
      <p class="sub">
        We’re putting the final pieces together. Something new is on the way.
      </p>
      <div class="contact">
        <a href="mailto:hello@unlimitedtrends.co.uk">hello@unlimitedtrends.co.uk</a>
      </div>
    </main>
  </body>
</html>
